# curiousj-framekit: the catalog of optional items, one entry each. The
# kinds (install/kinds/) do the work; an entry says what it is, how it
# installs, what it needs, and what is checked (the trust columns, from
# which TRUST.md is kept). Order here is the picker's order. What a
# package manager or upstream's own instructions install is not here:
# docs/simple-installs.md.

[item.cursor]
kind = "config"
description = "the software mouse cursor in Desktop Mode, and the cursor size"
trust_root = "this kit"
trust_checks = "nothing to fetch: two files in the home directory"

[item.tailscale]
kind = "system-service"
description = "Tailscale as a system service that survives updates (sudo)"
needs_root = true
trust_root = "pkgs.tailscale.com, Tailscale"
trust_checks = "the tarball against the .sha256 beside it"

[item.waypipe]
kind = "pacman-home"
description = "waypipe for the host, Arch Linux ARM's package relocated under ~/.local"
package = "waypipe"
relocate = true
trust_root = "Arch Linux ARM's Build System key, pinned by fingerprint in pacman-home"
trust_checks = "the package's PGP signature, by pacman; the keyring once, against the pinned fingerprint"

[item.emacs]
kind = "pacman-home"
description = "Emacs with PGTK, built here for ~/.local (about three minutes)"
package = "emacs-wayland"
pkgbuild = "emacs"
trust_root = "gnu.org's release tarball, your review of the PKGBUILD"
trust_checks = "the BLAKE2 sum in the PKGBUILD, by makepkg"

[item.krdc]
kind = "pacman-home"
description = "KRDC, KDE's RDP and VNC client, built here for ~/.local with hardware H.264 decode and the Remote pointer option (a few minutes; shadows the Flatpak)"
package = "krdc"
pkgbuild = "krdc"
trust_root = "download.kde.org's and pub.freerdp.com's release tarballs, LibVNCServer's GitHub tag archive and qtkeychain's GitHub repository, your review of the PKGBUILD and the patches"
trust_checks = "the BLAKE2 sums in the PKGBUILD, by makepkg; qtkeychain by the commit pinned there"

[item.fuse2]
kind = "pacman-home"
description = "libfuse 2 for the AppImages, built here for ~/.local (under a minute; SteamOS 0.5.7 dropped it, and BSManager's runtime loads it)"
package = "fuse2"
pkgbuild = "fuse2"
trust_root = "libfuse's GitHub release tarball, your review of the PKGBUILD"
trust_checks = "the BLAKE2 sums in the PKGBUILD, by makepkg"

[item.krdpserver]
kind = "pacman-home"
description = "KRdp's server, built here for ~/.local against the host's libraries (a few minutes; cjf rdp runs it)"
package = "krdpserver"
pkgbuild = "krdpserver"
menu_entry = "krdp"
trust_root = "download.kde.org's release tarballs and qtkeychain's GitHub repository, your review of the PKGBUILD and the patches"
trust_checks = "the BLAKE2 sums in the PKGBUILD, by makepkg; qtkeychain by the commit pinned there"

[item.gamescope-panel]
kind = "pacman-home"
description = "gamescope built here for ~/.local, its VR backend starting at any size: cjf panel runs an app in a SteamVR panel of its own (about ten minutes)"
package = "gamescope-panel"
pkgbuild = "gamescope-panel"
trust_root = "the gamescope, wlroots, openvr and other git repositories on GitHub and freedesktop.org, your review of the PKGBUILD and the patch"
trust_checks = "every git source pinned to a commit in the PKGBUILD, glm and stb to the revisions in gamescope's wrap files; the patch's BLAKE2 sum, by makepkg"

[item.xwayland-satellite]
kind = "pacman-home"
description = "xwayland-satellite, the X server WayVR gives the X11 apps in its panels, built here for ~/.local (about a minute; needs cargo)"
package = "xwayland-satellite"
pkgbuild = "xwayland-satellite"
trust_root = "xwayland-satellite's GitHub repository and crates.io, your review of the PKGBUILD"
trust_checks = "the git source pinned to a commit in the PKGBUILD; every crate by the checksum in Cargo.lock, by cargo --locked"

[item.wayvr]
kind = "pacman-home"
needs = ["xwayland-satellite"]
description = "WayVR, apps as panels around you in SteamVR, built here for ~/.local with a virtual output of any size, and wayvrctl (about ten minutes; needs cargo)"
package = "wayvr"
pkgbuild = "wayvr"
trust_root = "WayVR's GitHub repository, crates.io and the git repositories its Cargo.lock names, your review of the PKGBUILD and the patches"
trust_checks = "the git source pinned to a commit in the PKGBUILD; every crate by the checksum or commit in Cargo.lock, by cargo --locked; the patches' BLAKE2 sums, by makepkg"
