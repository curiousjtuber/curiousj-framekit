[project]
name = "curiousj-framekit"
version = "0.3.0"
description = "curiousj's kit for the Steam Frame: one command for its desktops, controllers, remote desktop and the things installed on it"
readme = "README.md"
license = "MIT"
authors = [{ name = "CuriousJ", email = "curious.j.tuber@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "click>=8.2",
]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/curiousjtuber/curiousj-framekit"

[project.scripts]
curiousj-framekit = "curiousj_framekit.cli:main"
cjf = "curiousj_framekit.cli:main"
beat-saber-recent = "curiousj_framekit.beatsaber.recent:main"
bsmanager = "curiousj_framekit.beatsaber.manager:main"
pacman-home = "curiousj_framekit.frame.pkg:pacman_home_main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/curiousj_framekit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
